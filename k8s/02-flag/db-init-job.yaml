apiVersion: v1
kind: ConfigMap
metadata:
  name: flag-service-db-schema
  namespace: togglemaster-flag
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS flags (
        id SERIAL PRIMARY KEY,

        -- 'name' é a chave de negócio única (ex: 'enable-new-checkout')
        name VARCHAR(100) UNIQUE NOT NULL, 
    
        description TEXT,
    
        -- Este é o 'kill switch' global. Se for false, a flag está desativada para todos.
        is_enabled BOOLEAN NOT NULL DEFAULT false,
    
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Opcional, mas boa prática: Trigger para atualizar 'updated_at' automaticamente
    CREATE OR REPLACE FUNCTION trigger_set_timestamp()
    RETURNS TRIGGER AS $$
    BEGIN
      NEW.updated_at = NOW();
      RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    -- Remove o trigger se já existir, para evitar erro na recriação
    DROP TRIGGER IF EXISTS set_timestamp ON flags;

    CREATE TRIGGER set_timestamp
    BEFORE UPDATE ON flags
    FOR EACH ROW
    EXECUTE PROCEDURE trigger_set_timestamp();
---
# Job que cria as tabelas no RDS (flags_db). Roda uma vez e termina.
apiVersion: batch/v1
kind: Job
metadata:
  name: flag-service-db-init
  namespace: togglemaster-flag
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: psql
        image: postgres:16-alpine
        command: ["sh", "-c", "psql \"$DATABASE_URL\" -v ON_ERROR_STOP=1 -f /sql/init.sql"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: flag-service-secret
              key: DATABASE_URL
        - name: HOME
          value: /tmp
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {cpu: 200m, memory: 128Mi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: sql
          mountPath: /sql
      volumes:
      - name: sql
        configMap:
          name: flag-service-db-schema
