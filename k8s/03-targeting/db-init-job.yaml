apiVersion: v1
kind: ConfigMap
metadata:
  name: targeting-service-db-schema
  namespace: togglemaster-targeting
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS targeting_rules (
        id SERIAL PRIMARY KEY,

        -- 'flag_name' é a chave de negócio única. 
        -- Cada flag pode ter no máximo UMA regra de segmentação.
        flag_name VARCHAR(100) UNIQUE NOT NULL,
    
        -- Se a regra de segmentação em si está ativa ou não
        is_enabled BOOLEAN NOT NULL DEFAULT true,
    
        -- Armazena a lógica da regra como um JSON.
        -- Ex: {"type": "PERCENTAGE", "value": 50}
        -- Ex: {"type": "USER_LIST", "values": ["u1", "u2"]}
        rules JSONB NOT NULL,
    
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Trigger para atualizar 'updated_at' automaticamente (igual ao do flag-service)
    CREATE OR REPLACE FUNCTION trigger_set_timestamp()
    RETURNS TRIGGER AS $$
    BEGIN
      NEW.updated_at = NOW();
      RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    DROP TRIGGER IF EXISTS set_timestamp ON targeting_rules;

    CREATE TRIGGER set_timestamp
    BEFORE UPDATE ON targeting_rules
    FOR EACH ROW
    EXECUTE PROCEDURE trigger_set_timestamp();
---
# Job que cria as tabelas no RDS (targeting_db). Roda uma vez e termina.
apiVersion: batch/v1
kind: Job
metadata:
  name: targeting-service-db-init
  namespace: togglemaster-targeting
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: psql
        image: postgres:16-alpine
        command: ["sh", "-c", "psql \"$DATABASE_URL\" -v ON_ERROR_STOP=1 -f /sql/init.sql"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: targeting-service-secret
              key: DATABASE_URL
        - name: HOME
          value: /tmp
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {cpu: 200m, memory: 128Mi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: sql
          mountPath: /sql
      volumes:
      - name: sql
        configMap:
          name: targeting-service-db-schema
